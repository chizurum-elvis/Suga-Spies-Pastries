name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code, browser, and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      NEXT_PUBLIC_SITE_URL: https://suga-spies.test
      PAYMENTS_MODE: disabled
      # CI deliberately receives no production database/provider credentials.
      RUN_OWNER_NAVIGATION_ACCEPTANCE: "0"
      RUN_OWNER_CONTENT_ACCEPTANCE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:release
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:release
      - run: npm run build -- --webpack
      - run: npx playwright install --with-deps chromium webkit
      # Credential-free smoke and synthetic order-state tests only. Connected
      # checkout/owner acceptance and macOS visual baselines run separately.
      - run: npx playwright test release-smoke.spec.ts content.spec.ts typography.spec.ts cancellation.spec.ts redelivery.spec.ts --project=chromium-desktop --project=webkit-mobile --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
